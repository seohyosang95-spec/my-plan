<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플랜두씨 다이어리 - 통합 시스템</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fdfbf7 0%, #f4eee1 100%);
            --text-color: #4a403a;
            --title-color: #5c4033;
            --subtitle-color: #8c7355;
            --card-bg: #ffffff;
            --card-border: #eee4d5;
            --input-bg: #faf8f5;
            --input-border: #dcd3c1;
            --input-text: #4a403a;
            --btn-bg: #bfa181;
            --btn-hover: #a48566;
            --li-bg: #faf6f0;
            --li-border: #f0e6da;
            --tag-bg: #e6dfd5;
            --tag-text: #6b4f3b;
            --sub-text: #a39587;
        }
        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            max-width: 950px; 
            margin: 0 auto; 
            padding: 30px 20px; 
            background: var(--bg-gradient); 
            color: var(--text-color); 
            min-height: 100vh;
        }
        .notice-banner {
            background-color: #fcf3cf;
            color: #7d6608;
            border: 1px solid #f9e79f;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        h1 { text-align: center; color: var(--title-color); font-size: 2.2em; margin: 0; flex-grow: 1; }
        .subtitle { text-align: center; color: var(--subtitle-color); margin-bottom: 25px; font-size: 1.1em; }
        .card { 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); 
            margin-bottom: 25px; 
            border: 1px solid var(--card-border);
        }
        h2 { color: var(--title-color); font-size: 1.3em; margin-top: 0; border-bottom: 2px solid var(--card-border); padding-bottom: 10px; }
        input, select, textarea { 
            padding: 10px 12px; 
            margin: 6px 0; 
            width: calc(100% - 24px); 
            box-sizing: border-box; 
            border: 1px solid var(--input-border); 
            border-radius: 8px; 
            background-color: var(--input-bg);
            color: var(--input-text);
            font-size: 0.95em;
        }
        button { 
            background-color: var(--btn-bg); 
            color: white; 
            border: none; 
            padding: 10px 15px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            font-size: 1em;
            margin-top: 5px;
        }
        button:hover { background-color: var(--btn-hover); }
        ul { list-style: none; padding: 0; }
        li { 
            display: flex; 
            flex-direction: column;
            background: var(--li-bg); 
            padding: 12px 15px; 
            margin-top: 10px; 
            border-radius: 10px; 
            border: 1px solid var(--li-border);
        }
        .li-main { display: flex; align-items: center; justify-content: space-between; width: 100%; flex-wrap: wrap; gap: 8px; }
        .analytics-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9em; }
        .analytics-table th, .analytics-table td { border: 1px solid var(--input-border); padding: 8px 10px; text-align: center; }
        .analytics-table th { background-color: var(--input-bg); color: var(--title-color); }
        .tag-badge { background-color: var(--tag-bg); color: var(--tag-text); padding: 3px 8px; border-radius: 6px; font-size: 0.8em; font-weight: bold; }
        .review-result-box { background: var(--li-bg); padding: 15px; border-radius: 10px; border: 1px solid var(--li-border); min-height: 80px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <!-- 공개 안내 문구 (T06-C82 반영) -->
    <div class="notice-banner">
        ⚠️ 지금은 로그인이 없어 링크를 아는 사람은 누구나 볼 수 있습니다. 남이 봐도 괜찮은 내용만 넣으세요.
    </div>

    <div class="header-container">
        <h1>플랜두씨 다이어리</h1>
    </div>
    <p class="subtitle">계획하고(Plan), 실행한 뒤(Do), 돌아보기(See)</p>

    <div class="card">
        <h2>새 계획 만들기</h2>
        <input type="text" id="planText" placeholder="핵심 계획 제목 입력">
        <input type="date" id="planDate" value="2026-09-01">
        <select id="planCategory">
            <option value="공부">카테고리: 공부</option>
            <option value="업무" selected>카테고리: 업무</option>
            <option value="운동">카테고리: 운동</option>
        </select>
        <button onclick="savePlan()">계획 등록하기</button>
    </div>

    <div class="card">
        <h2>📊 기간별 계획 및 실행 집계 분석</h2>
        <table class="analytics-table">
            <thead>
                <tr>
                    <th>계획명</th>
                    <th>계획수</th>
                    <th>완료수</th>
                    <th>지연수</th>
                    <th>막힘수</th>
                    <th>예상시간</th>
                    <th>실제시간</th>
                    <th>시간차이</th>
                </tr>
            </thead>
            <tbody id="analyticsTableBody"></tbody>
        </table>
    </div>

    <div class="card">
        <h2>내 계획 및 세부 할 일 (Todo) 목록</h2>
        <div id="planListContainer"></div>
    </div>

    <div class="card">
        <h2>하루 돌아보기 작성 및 확인</h2>
        <input type="date" id="reviewDate" value="2026-09-01">
        <textarea id="dailyReviewText" rows="3" placeholder="오늘 하루를 돌아보며 적어보세요"></textarea>
        <input type="text" id="nextPlanPoint" placeholder="다음 계획으로 넘길 고칠 점 한 줄 입력">
        <button onclick="saveReview()">돌아보기 저장하기</button>
        <div id="reviewResult" class="review-result-box" style="margin-top: 15px;"></div>
    </div>

    <div class="card">
        <h2>데이터 관리 (내보내기 / 복원 / DB연결 점검)</h2>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button onclick="exportData()" style="background-color: var(--sub-text);">데이터 전체 내보내기 (.json)</button>
            <button onclick="document.getElementById('importFile').click()">데이터 복원</button>
            <button onclick="checkDatabaseStatus()" style="background-color: var(--btn-hover);">DB 연결 상태 확인</button>
            <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
        </div>
    </div>

    <script>
        const PlanDoSeeDB = {
            storageKey: 'plandouce_db_v2',
            getInitialData() {
                return {
                    plans: [
                        {
                            id: 1725148800000,
                            text: "웹 서비스 프론트엔드 고도화 및 품질 검증 프로젝트",
                            date: "2026-09-01",
                            category: "업무",
                            priority: "상",
                            completed: false,
                            todos: [
                                { id: 1, text: "&lt;script&gt;alert('XSS Test')&lt;/script&gt; 스크립트 문자열 안전성 검토", date: "2026-08-25", priority: "상", tag: "보안", estimatedHours: 2.0, completed: true, executionLogs: [{ id: 101, startTime: "09:00", endTime: "11:00", actualHours: 2.0, blockReason: "" }] },
                                { id: 2, text: "UI 컴포넌트 반응형 레이아웃 그리드 점검", date: "2026-08-26", priority: "중", tag: "디자인", estimatedHours: 1.5, completed: true, executionLogs: [{ id: 102, startTime: "13:00", endTime: "15:00", actualHours: 2.0, blockReason: "CSS 호환성 충돌" }] },
                                { id: 3, text: "데이터베이스 스키마 v2 계약서 연동 확인", date: "2026-08-27", priority: "상", tag: "기획", estimatedHours: 3.0, completed: false, executionLogs: [{ id: 103, startTime: "10:00", endTime: "13:30", actualHours: 3.5, blockReason: "API 규격 불일치" }] },
                                { id: 4, text: "로컬 스토리지 백업 및 복원 기능 유닛 테스트", date: "2026-08-28", priority: "중", tag: "개발", estimatedHours: 1.0, completed: false, executionLogs: [] },
                                { id: 5, text: "최종 제출문 작성 및 최종 검수 진행", date: "2026-08-29", priority: "상", tag: "문서", estimatedHours: 2.0, completed: false, executionLogs: [] }
                            ]
                        }
                    ],
                    reviews: {
                        "2026-09-01": {
                            text: "계획했던 프론트엔드 고도화와 XSS 방어 문자열 검증을 완료함.",
                            nextPoint: "다음부터는 API 규격 문서를 사전에 더 철저히 검토할 것."
                        }
                    }
                };
            },
            load() {
                const data = localStorage.getItem(this.storageKey);
                if (!data) {
                    const initial = this.getInitialData();
                    this.save(initial);
                    return initial;
                }
                try {
                    return JSON.parse(data);
                } catch (e) {
                    return this.getInitialData();
                }
            },
            save(data) {
                localStorage.setItem(this.storageKey, JSON.stringify(data));
            }
        };

        let dbData = PlanDoSeeDB.load();
        let plans = dbData.plans;
        let reviews = dbData.reviews;

        function saveAndRender() {
            PlanDoSeeDB.save({ plans, reviews });
            renderPlans();
            renderAnalytics();
            renderReview();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function savePlan() {
            const textInput = document.getElementById('planText');
            const text = textInput.value.trim();
            if (!text) return alert('계획 제목을 입력해주세요.');
            plans.push({
                id: Date.now(),
                text: escapeHtml(text),
                date: document.getElementById('planDate').value,
                category: document.getElementById('planCategory').value,
                priority: '상',
                completed: false,
                todos: []
            });
            textInput.value = '';
            saveAndRender();
        }

        function renderAnalytics() {
            const tbody = document.getElementById('analyticsTableBody');
            tbody.innerHTML = '';
            plans.forEach(p => {
                const todos = p.todos || [];
                const planCount = todos.length;
                const completedCount = todos.filter(t => t.completed).length;
                const delayedCount = todos.filter(t => !t.completed && t.date < "2026-09-01").length;
                const blockedCount = todos.filter(t => t.executionLogs && t.executionLogs.some(l => l.blockReason)).length;
                const totalEstimated = todos.reduce((s, t) => s + (t.estimatedHours || 0), 0);
                const totalActual = todos.reduce((s, t) => s + (t.executionLogs || []).reduce((acc, l) => acc + (l.actualHours || 0), 0), 0);
                const timeDiff = totalActual - totalEstimated;

                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight:bold;">${p.text}</td>
                        <td>${planCount}개</td>
                        <td>${completedCount}개</td>
                        <td>${delayedCount}개</td>
                        <td>${blockedCount}개</td>
                        <td>${totalEstimated}시간</td>
                        <td>${totalActual}시간</td>
                        <td>${timeDiff > 0 ? '+' : ''}${timeDiff}시간</td>
                    </tr>
                `;
            });
        }

        function renderPlans() {
            const container = document.getElementById('planListContainer');
            container.innerHTML = '';
            plans.forEach(p => {
                container.innerHTML += `
                    <div class="card" style="background:var(--li-bg); margin-bottom:10px;">
                        <div style="font-weight:bold; font-size:1.05em; margin-bottom:8px;">📌 ${p.text}</div>
                        <ul>
                            ${(p.todos || []).map(t => `
                                <li style="margin-bottom:6px;">
                                    <div class="li-main">
                                        <span><span class="tag-badge">#${t.tag}</span> <b>${t.text}</b> (예상: ${t.estimatedHours}h / 마감: ${t.date})</span>
                                        <span>완료: ${t.completed ? 'O' : 'X'} | 로그: ${(t.executionLogs || []).length}건</span>
                                    </div>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
            });
        }

        function saveReview() {
            const date = document.getElementById('reviewDate').value;
            const text = document.getElementById('dailyReviewText').value.trim();
            const nextPoint = document.getElementById('nextPlanPoint').value.trim();
            if (!text) return alert('내용을 입력하세요.');
            reviews[date] = { text: escapeHtml(text), nextPoint: escapeHtml(nextPoint) };
            saveAndRender();
            alert('돌아보기 저장 완료');
        }

        function renderReview() {
            const date = document.getElementById('reviewDate').value;
            const rev = reviews[date];
            const box = document.getElementById('reviewResult');
            if (rev) {
                document.getElementById('dailyReviewText').value = rev.text;
                document.getElementById('nextPlanPoint').value = rev.nextPoint || '';
                box.innerHTML = `<b>[${date} 돌아보기]</b><br>${rev.text}<br><br>📌 다음 계획으로 넘긴 고칠 점: <b>${rev.nextPoint || '없음'}</b>`;
            } else {
                box.innerHTML = '해당 날짜의 돌아보기 기록이 없습니다.';
            }
        }

        function exportData() {
            const data = { plans, reviews };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'plandouce_backup.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.plans && parsed.reviews) {
                        plans = parsed.plans;
                        reviews = parsed.reviews;
                        saveAndRender();
                        alert('데이터 복원 완료');
                    } else {
                        alert('올바르지 않은 백업 파일 형식입니다.');
                    }
                } catch (err) {
                    alert('파일을 읽는 중 오류가 발생했습니다.');
                }
            };
            reader.readAsText(file);
        }

        function checkDatabaseStatus() {
            const status = localStorage.getItem(PlanDoSeeDB.storageKey) ? '연결 및 정상 작동 중 (Persistence Active)' : '연결 필요';
            alert(`[데이터베이스 상태 점검]\n- 저장소 유형: 브라우저 영구 저장소 (LocalStorage Repository)\n- 상태: ${status}\n- 스키마 버전: v2 호환`);
        }

        saveAndRender();
    </script>
</body>
</html>
