<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>플랜두씨 다이어리</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 16px;
    color: #222;
    background: #fafaf8;
  }
  h1 { font-size: 22px; font-weight: 600; margin: 0; }
  h2 { font-size: 14px; font-weight: 600; margin: 0; color: #444; }
  .subtitle { font-size: 13px; color: #8a8a86; margin: 4px 0 16px; }
  .banner {
    background: #fff8e6; border: 1px solid #f0d989; border-radius: 10px;
    padding: 10px 14px; margin-bottom: 16px; font-size: 13px;
  }
  .banner.error { background: #fdeaea; border-color: #f0a8a8; color: #a32d2d; display: none; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid #eee; }
  .tab-btn {
    padding: 8px 4px; margin-bottom: -1px; border: none; background: none;
    border-bottom: 2px solid transparent; font-size: 14px; color: #888; cursor: pointer;
  }
  .tab-btn.active { border-bottom-color: #222; font-weight: 600; color: #222; }
  .date-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
  .date-chip {
    flex-shrink: 0; padding: 6px 12px; border-radius: 20px; border: 1px solid #ddd;
    background: #fff; color: #555; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .date-chip.active { border: 1.5px solid #222; background: #222; color: #fff; }
  .date-chip.add { border: 1px dashed #ccc; color: #888; }
  .section { margin-bottom: 20px; }
  .section-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .plan-form { display: flex; gap: 6px; margin-bottom: 10px; }
  input[type=text], textarea {
    padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; font-family: inherit;
  }
  .plan-form input[name=time] { width: 70px; }
  .plan-form input[name=text] { flex: 1; }
  .btn-add {
    padding: 8px 12px; background: #222; color: #fff; border: none; border-radius: 8px; cursor: pointer;
  }
  .empty-hint { font-size: 13px; color: #aaa; margin: 8px 0; }
  .plan-card { border: 1px solid #eee; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .plan-row { display: flex; align-items: flex-start; gap: 8px; }
  .plan-text { flex: 1; font-size: 14px; font-weight: 500; }
  .plan-time { color: #999; font-weight: 400; margin-right: 6px; }
  .btn-remove { border: none; background: none; color: #bbb; cursor: pointer; font-size: 16px; padding: 2px; }
  .check-row { display: flex; gap: 6px; margin-top: 8px; }
  .check-btn {
    font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid #ddd;
    background: #fff; color: #777; cursor: pointer;
  }
  .check-btn.done.active { border-color: #1D9E75; background: #E1F5EE; color: #0F6E56; }
  .check-btn.missed.active { border-color: #E24B4A; background: #FCEBEB; color: #A32D2D; }
  .note-input { width: 100%; margin-top: 8px; padding: 6px 8px; border: 1px solid #eee; border-radius: 6px; font-size: 12px; }
  textarea.reflection { width: 100%; padding: 10px; border-radius: 8px; font-size: 13px; resize: vertical; }
  .hint-small { font-size: 11px; color: #aaa; margin-top: 4px; }
  .stats-card { background: #f7f7f5; border-radius: 12px; padding: 16px; margin-bottom: 16px; text-align: center; }
  .stats-rate { font-size: 32px; font-weight: 700; margin: 4px 0; }
  .stats-label { font-size: 13px; color: #888; }
  .stats-sub { font-size: 12px; color: #aaa; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat-box {
    border: none; border-radius: 10px; padding: 14px 8px; display: flex;
    flex-direction: column; align-items: center; gap: 4px; cursor: pointer;
  }
  .stat-box .num { font-size: 22px; font-weight: 700; }
  .stat-box .lab { font-size: 12px; }
  .drill-back { border: none; background: none; color: #888; font-size: 13px; margin-bottom: 12px; padding: 0; cursor: pointer; }
  .drill-item { border: 1px solid #eee; border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; }
  .drill-date { font-size: 12px; color: #999; }
  .drill-text { font-size: 14px; }
  .drill-note { font-size: 12px; color: #888; margin-top: 2px; }
  .view { display: none; }
  .view.active { display: block; }
</style>
</head>
<body>

<h1>플랜두씨 다이어리</h1>
<p class="subtitle">계획(Plan) → 실행(Do) → 돌아보기(See)</p>

<div class="banner">
  이 페이지는 아직 로그인 기능이 없습니다. <b>이 링크를 아는 사람은 누구나 내용을 보고 편집할 수 있습니다.</b>
  공개해도 괜찮은 내용만 기록해 주세요. 잠그는 기능은 이후 과제에서 추가됩니다.
</div>
<div class="banner error" id="saveError">저장에 실패했습니다. 네트워크를 확인하고 다시 시도해 주세요.</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="day">오늘의 계획</button>
  <button class="tab-btn" data-tab="stats">집계</button>
</div>

<!-- DAY VIEW -->
<div class="view active" id="view-day">
  <div class="date-scroll" id="dateScroll"></div>

  <div class="section">
    <div class="section-head"><h2>계획 (Plan)</h2></div>
    <div class="plan-form">
      <input type="text" name="time" id="newTime" placeholder="09:00">
      <input type="text" name="text" id="newText" placeholder="예: 알고리즘 문제 2개 풀기">
      <button class="btn-add" id="addPlanBtn">+</button>
    </div>
    <div id="plansContainer"></div>
  </div>

  <div class="section">
    <div class="section-head"><h2>돌아보기 (See)</h2></div>
    <textarea class="reflection" id="reflectionBox" rows="4" placeholder="오늘 계획과 실제가 어디서 어긋났나요? 다음 계획에 반영할 점은?"></textarea>
    <p class="hint-small">입력란에서 벗어나면 자동 저장됩니다.</p>
  </div>
</div>

<!-- STATS VIEW -->
<div class="view" id="view-stats">
  <div class="stats-card">
    <div class="stats-label">전체 실행률</div>
    <div class="stats-rate" id="rateNum">0%</div>
    <div class="stats-sub" id="totalNum">총 계획 0건</div>
  </div>
  <div class="stat-grid">
    <button class="stat-box" style="background:#E1F5EE" data-filter="done">
      <span class="num" style="color:#0F6E56" id="doneNum">0</span>
      <span class="lab" style="color:#0F6E56">완료</span>
    </button>
    <button class="stat-box" style="background:#FCEBEB" data-filter="missed">
      <span class="num" style="color:#A32D2D" id="missedNum">0</span>
      <span class="lab" style="color:#A32D2D">못함</span>
    </button>
    <button class="stat-box" style="background:#f2f2f2" data-filter="pending">
      <span class="num" style="color:#666" id="pendingNum">0</span>
      <span class="lab" style="color:#666">체크 안 함</span>
    </button>
  </div>
  <p class="hint-small" style="text-align:center; margin-top:12px;">숫자를 누르면 해당 기록 목록으로 이동합니다.</p>
</div>

<!-- DRILL VIEW -->
<div class="view" id="view-drill">
  <button class="drill-back" id="drillBackBtn">← 집계로 돌아가기</button>
  <h2 id="drillTitle"></h2>
  <div id="drillContainer"></div>
</div>

<script>
/*
  ============================================================
  저장소 안내:
  지금은 브라우저 localStorage로 저장합니다 (이 컴퓨터, 이 브라우저에만 남음).
  실제 과제 제출용 "서버의 실제 데이터베이스"로 바꾸려면,
  아래 STORAGE 객체의 get/set 두 함수만 Supabase 호출로 교체하면 됩니다.
  예)
    async function get() { return (await supabase.from('entries').select()).data }
    async function set(data) { await supabase.from('entries').upsert(data) }
  나머지 화면 코드는 전혀 건드릴 필요가 없습니다.
  ============================================================
*/
const STORAGE_KEY = 'plandosee:entries';

const STORAGE = {
  async get() {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  },
  async set(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  }
};

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function today() { return new Date().toISOString().slice(0, 10); }
function fmtDate(d) {
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', weekday: 'short' });
}

function buildSeedData() {
  const t = today();
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yesterday = y.toISOString().slice(0, 10);
  return {
    [yesterday]: {
      plans: [
        { id: uid(), time: '09:00', text: '플랜두씨 다이어리 기획 정리', done: true, actualNote: '초안은 예상보다 30분 더 걸림' },
        { id: uid(), time: '14:00', text: '데이터 모델(Plan/Do/See) 설계', done: true, actualNote: '' },
        { id: uid(), time: '20:00', text: '운동 30분', done: false, actualNote: '야근으로 못함' },
      ],
      reflection: '오전 작업은 예상보다 시간이 더 걸렸다. 다음엔 준비 시간을 15분 더 넉넉히 잡자. 저녁 계획은 야근 가능성을 고려하지 않았음 — 저녁 일정은 유동적으로 잡을 것.'
    },
    [t]: {
      plans: [
        { id: uid(), time: '10:00', text: 'Plan/Do/See 저장 로직 구현', done: null, actualNote: '' },
        { id: uid(), time: '15:00', text: '집계 화면(드릴다운) 구현', done: null, actualNote: '' },
      ],
      reflection: ''
    }
  };
}

let days = {};
let selectedDate = today();
let currentDrillFilter = null;

async function loadData() {
  let data = await STORAGE.get();
  if (!data) {
    data = buildSeedData();
    await STORAGE.set(data);
  }
  days = data;
}

async function persist() {
  try {
    const ok = await STORAGE.set(days);
    if (!ok) throw new Error('save failed');
    document.getElementById('saveError').style.display = 'none';
  } catch (e) {
    console.error(e);
    document.getElementById('saveError').style.display = 'block';
  }
}

function ensureDay(date) {
  if (!days[date]) days[date] = { plans: [], reflection: '' };
  return days[date];
}

function renderDateScroll() {
  const scroll = document.getElementById('dateScroll');
  const dates = Array.from(new Set([...Object.keys(days), today()])).sort();
  scroll.innerHTML = '';
  dates.forEach(d => {
    const chip = document.createElement('button');
    chip.className = 'date-chip' + (d === selectedDate ? ' active' : '');
    chip.textContent = fmtDate(d);
    chip.onclick = () => { selectedDate = d; renderAll(); };
    scroll.appendChild(chip);
  });
  const addChip = document.createElement('button');
  addChip.className = 'date-chip add';
  addChip.textContent = '+ 날짜';
  addChip.onclick = () => {
    const nd = prompt('YYYY-MM-DD 형식으로 날짜를 입력하세요', today());
    if (nd && /^\d{4}-\d{2}-\d{2}$/.test(nd)) { selectedDate = nd; renderAll(); }
  };
  scroll.appendChild(addChip);
}

function renderPlans() {
  const container = document.getElementById('plansContainer');
  const dayData = ensureDay(selectedDate);
  container.innerHTML = '';
  if (dayData.plans.length === 0) {
    container.innerHTML = '<p class="empty-hint">이 날짜에 계획이 없습니다. 위에서 추가해 보세요.</p>';
    return;
  }
  dayData.plans.forEach(plan => {
    const card = document.createElement('div');
    card.className = 'plan-card';
    card.innerHTML = `
      <div class="plan-row">
        <div class="plan-text">${plan.time ? `<span class="plan-time">${plan.time}</span>` : ''}${escapeHtml(plan.text)}</div>
        <button class="btn-remove" data-remove="${plan.id}">×</button>
      </div>
      <div class="check-row">
        <button class="check-btn done ${plan.done === true ? 'active' : ''}" data-toggle="${plan.id}" data-value="true">했음</button>
        <button class="check-btn missed ${plan.done === false ? 'active' : ''}" data-toggle="${plan.id}" data-value="false">못함</button>
      </div>
      ${plan.done !== null ? `<input type="text" class="note-input" data-note="${plan.id}" value="${escapeAttr(plan.actualNote || '')}" placeholder="${plan.done ? '실제로 어떻게 했는지 메모 (선택)' : '왜 못했는지 메모 (선택)'}">` : ''}
    `;
    container.appendChild(card);
  });

  container.querySelectorAll('[data-remove]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.remove;
      ensureDay(selectedDate).plans = ensureDay(selectedDate).plans.filter(p => p.id !== id);
      await persist();
      renderAll();
    };
  });
  container.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.toggle;
      const value = btn.dataset.value === 'true';
      const plan = ensureDay(selectedDate).plans.find(p => p.id === id);
      plan.done = plan.done === value ? null : value;
      await persist();
      renderAll();
    };
  });
  container.querySelectorAll('[data-note]').forEach(input => {
    input.onblur = async () => {
      const id = input.dataset.note;
      const plan = ensureDay(selectedDate).plans.find(p => p.id === id);
      plan.actualNote = input.value;
      await persist();
    };
  });
}

function renderReflection() {
  const box = document.getElementById('reflectionBox');
  box.value = ensureDay(selectedDate).reflection || '';
  box.onblur = async () => {
    ensureDay(selectedDate).reflection = box.value;
    await persist();
  };
}

function computeStats() {
  const allPlans = Object.keys(days).flatMap(d => (days[d].plans || []).map(p => ({ ...p, date: d })));
  const doneCount = allPlans.filter(p => p.done === true).length;
  const missedCount = allPlans.filter(p => p.done === false).length;
  const total = allPlans.length;
  const pending = total - doneCount - missedCount;
  const rate = total ? Math.round((doneCount / total) * 100) : 0;
  return { allPlans, doneCount, missedCount, pending, total, rate };
}

function renderStats() {
  const { doneCount, missedCount, pending, total, rate } = computeStats();
  document.getElementById('rateNum').textContent = rate + '%';
  document.getElementById('totalNum').textContent = `총 계획 ${total}건`;
  document.getElementById('doneNum').textContent = doneCount;
  document.getElementById('missedNum').textContent = missedCount;
  document.getElementById('pendingNum').textContent = pending;
}

function renderDrill() {
  const { allPlans } = computeStats();
  const labelMap = { done: '완료한 일', missed: '못한 일', pending: '체크하지 않은 계획' };
  let items = [];
  if (currentDrillFilter === 'done') items = allPlans.filter(p => p.done === true);
  else if (currentDrillFilter === 'missed') items = allPlans.filter(p => p.done === false);
  else if (currentDrillFilter === 'pending') items = allPlans.filter(p => p.done === null);
  items.sort((a, b) => b.date.localeCompare(a.date));

  document.getElementById('drillTitle').textContent = `${labelMap[currentDrillFilter]} (${items.length})`;
  const container = document.getElementById('drillContainer');
  container.innerHTML = '';
  if (items.length === 0) {
    container.innerHTML = '<p class="empty-hint">해당하는 기록이 없습니다.</p>';
    return;
  }
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'drill-item';
    div.innerHTML = `
      <div class="drill-date">${fmtDate(item.date)}${item.time ? ' · ' + item.time : ''}</div>
      <div class="drill-text">${escapeHtml(item.text)}</div>
      ${item.actualNote ? `<div class="drill-note">메모: ${escapeHtml(item.actualNote)}</div>` : ''}
    `;
    container.appendChild(div);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function escapeAttr(str) {
  return String(str).replace(/"/g, '&quot;');
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + tab).classList.add('active');
}

function renderAll() {
  renderDateScroll();
  renderPlans();
  renderReflection();
  renderStats();
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => switchTab(btn.dataset.tab);
});

document.getElementById('addPlanBtn').onclick = async () => {
  const textInput = document.getElementById('newText');
  const timeInput = document.getElementById('newTime');
  if (!textInput.value.trim()) return;
  ensureDay(selectedDate).plans.push({
    id: uid(), text: textInput.value.trim(), time: timeInput.value.trim(),
    done: null, actualNote: ''
  });
  textInput.value = '';
  timeInput.value = '';
  await persist();
  renderAll();
};
document.getElementById('newText').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('addPlanBtn').click();
});

document.querySelectorAll('[data-filter]').forEach(btn => {
  btn.onclick = () => {
    currentDrillFilter = btn.dataset.filter;
    renderDrill();
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-drill').classList.add('active');
  };
});
document.getElementById('drillBackBtn').onclick = () => switchTab('stats');

(async function init() {
  await loadData();
  renderAll();
})();
</script>
</body>
</html>
