<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플랜두씨 다이어리</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fdfbf7 0%, #f4eee1 100%);
            --text-color: #4a403a;
            --title-color: #5c4033;
            --subtitle-color: #8c7355;
            --card-bg: #ffffff;
            --card-border: #eee4d5;
            --input-bg: #faf8f5;
            --input-border: #dcd3c1;
            --input-text: #4a403a;
            --btn-bg: #bfa181;
            --btn-hover: #a48566;
            --li-bg: #faf6f0;
            --li-border: #f0e6da;
            --tag-bg: #e6dfd5;
            --tag-text: #6b4f3b;
            --sub-text: #a39587;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #1f1b18 0%, #2c2621 100%);
            --text-color: #e6dfd5;
            --title-color: #f4eee1;
            --subtitle-color: #c2b29f;
            --card-bg: #28221e;
            --card-border: #3d342d;
            --input-bg: #322b25;
            --input-border: #4d4239;
            --input-text: #e6dfd5;
            --btn-bg: #9c8b7c;
            --btn-hover: #bfa181;
            --li-bg: #322b25;
            --li-border: #3d342d;
            --tag-bg: #41372f;
            --tag-text: #e6dfd5;
            --sub-text: #8c7355;
        }

        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 30px 20px; 
            background: var(--bg-gradient); 
            color: var(--text-color); 
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        h1 { text-align: center; color: var(--title-color); font-size: 2.2em; margin: 0; flex-grow: 1; }
        .theme-toggle-btn { background: none; border: none; font-size: 1.5em; cursor: pointer; padding: 5px; width: auto; }
        .subtitle { text-align: center; color: var(--subtitle-color); margin-bottom: 35px; font-size: 1.1em; }
        .card { 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); 
            margin-bottom: 25px; 
            border: 1px solid var(--card-border);
            transition: background 0.3s, border 0.3s;
        }
        h2 { color: var(--title-color); font-size: 1.3em; margin-top: 0; border-bottom: 2px solid var(--card-border); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        input, select, textarea { 
            padding: 10px 12px; 
            margin: 6px 0; 
            width: calc(100% - 24px); 
            box-sizing: border-box; 
            border: 1px solid var(--input-border); 
            border-radius: 8px; 
            background-color: var(--input-bg);
            color: var(--input-text);
            font-size: 0.95em;
            transition: background 0.3s, border 0.3s, color 0.3s;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--btn-hover);
        }
        .row-group { display: flex; gap: 10px; }
        .row-group select, .row-group input { width: 50%; }
        
        button { 
            background-color: var(--btn-bg); 
            color: white; 
            border: none; 
            padding: 10px 15px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            font-size: 1em;
            transition: background 0.2s;
            margin-top: 5px;
        }
        button:hover { background-color: var(--btn-hover); }
        
        ul { list-style: none; padding: 0; }
        li { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            background: var(--li-bg); 
            padding: 12px 15px; 
            margin-top: 10px; 
            border-radius: 10px; 
            border: 1px solid var(--li-border);
            transition: background 0.3s, border 0.3s;
        }
        li.completed span.text { text-decoration: line-through; opacity: 0.5; }
        .li-left { display: flex; align-items: center; gap: 10px; flex-grow: 1; overflow: hidden; flex-wrap: wrap; }
        input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--btn-bg); cursor: pointer; margin: 0; flex-shrink: 0; }
        
        .tag-badge {
            background-color: var(--tag-bg);
            color: var(--tag-text);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.8em;
            font-weight: bold;
            flex-shrink: 0;
        }
        
        .btn-group { display: flex; gap: 5px; flex-shrink: 0; }
        .action-btn { background-color: var(--subtitle-color); width: auto; padding: 5px 8px; font-size: 0.8em; border-radius: 6px; margin: 0; color: white; }
        .action-btn:hover { background-color: var(--btn-hover); }
        .delete-btn { background-color: #d99b9b; width: auto; padding: 5px 8px; font-size: 0.8em; border-radius: 6px; margin: 0; color: white; }
        .delete-btn:hover { background-color: #c48282; }

        .control-panel { background: var(--input-bg); padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--input-border); font-size: 0.9em; display: flex; flex-direction: column; gap: 8px; }
        .control-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .sort-desc { font-size: 0.8em; color: var(--sub-text); margin-top: 4px; }

        .sub-todo-section { margin-top: 15px; padding-top: 12px; border-top: 1px dashed var(--input-border); }
        .sub-todo-input-box { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto; gap: 6px; margin-top: 8px; }
        @media (max-width: 768px) { .sub-todo-input-box { grid-template-columns: 1fr; } }

        .review-result-box { background: var(--li-bg); padding: 15px; border-radius: 10px; border: 1px solid var(--li-border); min-height: 80px; }
        .review-content-text { white-space: pre-wrap; margin-bottom: 10px; }
        .review-actions { display: flex; gap: 5px; justify-content: flex-end; }

        .stats { display: flex; justify-content: space-around; text-align: center; }
        .stats div div:last-child { font-size: 1.8em; font-weight: bold; color: var(--title-color); margin-top: 8px; }
    </style>
</head>
<body data-theme="light">

    <!-- 로그인 / 회원가입 화면 -->
    <div id="authScreen" class="card" style="max-width: 400px; margin: 60px auto;">
        <h1 style="text-align:center; font-size: 1.6em; margin-bottom: 20px;">플랜두씨 다이어리</h1>
        <h2 id="authTitle" style="text-align:center;">로그인</h2>
        <input type="email" id="authEmail" placeholder="이메일">
        <input type="password" id="authPassword" placeholder="비밀번호 (6자 이상)">
        <button id="authSubmitBtn" onclick="handleAuthSubmit()">로그인</button>
        <p style="text-align:center; margin-top: 15px;">
            <a href="#" onclick="toggleAuthMode(); return false;" id="authToggleLink" style="color: var(--btn-bg);">계정이 없으신가요? 회원가입</a>
        </p>
        <p id="authError" style="color: #c0392b; text-align:center; margin-top: 10px;"></p>
    </div>

    <!-- 로그인 후 보이는 전체 화면 -->
    <div id="appContent" style="display:none;">

    <div class="header-container">
        <div style="width: 40px;"></div>
        <h1>플랜두씨 다이어리</h1>
        <button class="theme-toggle-btn" onclick="toggleTheme()" title="테마 변경">🌙</button>
    </div>
    <p class="subtitle">계획하고(Plan), 실행한 뒤(Do), 돌아보기(See)</p>

    <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom: 20px; flex-wrap: wrap; gap: 8px;">
        <span id="userEmailDisplay" style="color: var(--subtitle-color); font-size: 0.9em;"></span>
        <div>
            <button onclick="handleLogout()" style="width:auto; padding: 8px 16px; margin-right: 8px;">로그아웃</button>
            <button onclick="handleDeleteAccount()" style="width:auto; padding: 8px 16px; background-color:#c0392b;">계정 삭제</button>
        </div>
    </div>

    <!-- 계획 카드 -->
    <div class="card">
        <h2 id="formTitle">새 계획 만들기</h2>
        <input type="hidden" id="editIndex" value="">
        <input type="text" id="planText" placeholder="핵심 계획 제목 입력">
        <div class="row-group">
            <input type="date" id="planDate">
            <select id="planCategory">
                <option value="공부">카테고리: 공부</option>
                <option value="업무" selected>카테고리: 업무</option>
                <option value="운동">카테고리: 운동</option>
                <option value="생활">카테고리: 생활</option>
                <option value="기타">카테고리: 기타</option>
            </select>
        </div>
        <select id="planPriority">
            <option value="상">중요도: 상</option>
            <option value="중" selected>중요도: 중</option>
            <option value="하">중요도: 하</option>
        </select>
        <button id="submitBtn" onclick="savePlan()">계획 등록하기</button>
        <button id="cancelBtn" onclick="resetForm()" style="background-color: #b5aca6; display: none; margin-top: 8px;">수정 취소</button>
    </div>

    <!-- 내 계획 목록 및 할 일 관리 -->
    <div class="card">
        <h2>
            내 계획 및 세부 할 일 (Todo) 목록
            <div style="font-size: 0.85em; font-weight: normal; color: var(--subtitle-color);">
                <label><input type="checkbox" id="hideCompletedPlans" onchange="renderPlans()"> 완료된 계획 숨기기</label>
            </div>
        </h2>
        <div id="planListContainer"></div>
    </div>

    <!-- 하루 돌아보기 작성 -->
    <div class="card">
        <h2>하루 돌아보기 작성</h2>
        <input type="date" id="reviewDate">
        <textarea id="dailyReviewText" rows="4" placeholder="오늘 하루를 돌아보며 적어보세요"></textarea>
        <button onclick="saveReview()">돌아보기 저장하기</button>
    </div>

    <!-- 날짜별 돌아보기 조회 -->
    <div class="card">
        <h2>날짜별 돌아보기 보기</h2>
        <div class="search-box" style="display: flex; gap: 10px; align-items: center; margin-bottom: 15px;">
            <input type="date" id="searchDate" onchange="searchReview()" style="margin: 0; flex-grow: 1;">
            <button onclick="clearSearch()" style="width: auto; margin: 0; padding: 10px 20px;">오늘 보기</button>
        </div>
        <div id="reviewResult" class="review-result-box">
            <div class="review-content-text">날짜를 선택하면 해당 기록이 여기에 표시됩니다.</div>
        </div>
    </div>

    <!-- 전체 통계 및 백업 -->
    <div class="card">
        <h2>전체 집계 및 데이터 관리</h2>
        <div class="stats" style="margin-bottom: 20px;">
            <div>
                <div>등록된 계획</div>
                <div id="totalCount">0개</div>
            </div>
            <div>
                <div>완료된 계획</div>
                <div id="completedCount">0개</div>
            </div>
            <div>
                <div>진행 중 계획</div>
                <div id="pendingCount">0개</div>
            </div>
        </div>
        <div style="display: flex; gap: 10px;">
            <button onclick="exportData()" style="background-color: var(--sub-text);">데이터 백업</button>
            <button onclick="document.getElementById('importFile').click()">데이터 복원</button>
            <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
        </div>
    </div>

    </div><!-- /appContent -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // --- Supabase 연결 설정 ---
        const SUPABASE_URL = 'https://iphlnjvuxlrjzuqwljxe.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_J9Ktjq0DciqaXLcFZiqwug_-yEdokMu';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let plans = [];
        let reviews = {};
        let currentUser = null;
        let authMode = 'login'; // 'login' 또는 'signup'
        let currentTheme = localStorage.getItem('theme') || 'light';

        // --- 인증(로그인/회원가입) 관련 ---
        function toggleAuthMode() {
            authMode = (authMode === 'login') ? 'signup' : 'login';
            document.getElementById('authTitle').innerText = (authMode === 'login') ? '로그인' : '회원가입';
            document.getElementById('authSubmitBtn').innerText = (authMode === 'login') ? '로그인' : '회원가입';
            document.getElementById('authToggleLink').innerText = (authMode === 'login') ? '계정이 없으신가요? 회원가입' : '이미 계정이 있으신가요? 로그인';
            document.getElementById('authError').innerText = '';
        }

        async function handleAuthSubmit() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            const errorBox = document.getElementById('authError');
            errorBox.innerText = '';

            if (!email || !password) {
                errorBox.innerText = '이메일과 비밀번호를 모두 입력해주세요.';
                return;
            }

            if (authMode === 'signup') {
                const { data, error } = await db.auth.signUp({ email, password });
                if (error) {
                    errorBox.innerText = '회원가입 실패: ' + error.message;
                    return;
                }
                if (data.session) {
                    await afterLogin(data.session.user);
                } else {
                    errorBox.style.color = 'green';
                    errorBox.innerText = '가입 확인 메일을 보냈습니다. 메일함을 확인해주세요.';
                }
            } else {
                const { data, error } = await db.auth.signInWithPassword({ email, password });
                if (error) {
                    errorBox.innerText = '로그인 실패: 이메일 또는 비밀번호를 확인해주세요.';
                    return;
                }
                await afterLogin(data.user);
            }
        }

        async function afterLogin(user) {
            currentUser = user;
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appContent').style.display = 'block';
            document.getElementById('userEmailDisplay').innerText = user.email + ' 님으로 로그인됨';
            await loadData();
        }

        async function handleLogout() {
            await db.auth.signOut();
            currentUser = null;
            plans = [];
            reviews = {};
            document.getElementById('appContent').style.display = 'none';
            document.getElementById('authScreen').style.display = 'block';
            document.getElementById('authEmail').value = '';
            document.getElementById('authPassword').value = '';
        }

        async function handleDeleteAccount() {
            if (!confirm('정말로 계정을 삭제하시겠습니까? 저장된 모든 계획과 돌아보기 기록이 영구 삭제됩니다.')) return;
            if (!currentUser) return;
            await db.from('plans').delete().eq('user_id', currentUser.id);
            await db.from('reviews').delete().eq('user_id', currentUser.id);
            alert('회원님의 모든 자료가 삭제되었습니다. 이제 로그아웃됩니다.');
            await handleLogout();
        }

        async function checkExistingSession() {
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                await afterLogin(session.user);
            } else {
                document.getElementById('authScreen').style.display = 'block';
                document.getElementById('appContent').style.display = 'none';
            }
        }

        document.body.setAttribute('data-theme', currentTheme);
        document.querySelector('.theme-toggle-btn').innerText = currentTheme === 'dark' ? '☀️' : '🌙';

        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', currentTheme);
            document.querySelector('.theme-toggle-btn').innerText = currentTheme === 'dark' ? '☀️' : '🌙';
            localStorage.setItem('theme', currentTheme);
        }

        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('planDate').value = todayStr;
        document.getElementById('reviewDate').value = todayStr;
        document.getElementById('searchDate').value = todayStr;

        async function saveAndRender() {
            if (plans.length > 0) {
                const { error } = await db.from('plans').upsert(plans);
                if (error) console.error('저장 실패:', error);
            }
            renderPlans();
        }

        // --- 계획 관리 ---
        function savePlan() {
            const editIndex = document.getElementById('editIndex').value;
            const textInput = document.getElementById('planText');
            const dateInput = document.getElementById('planDate');
            const categoryInput = document.getElementById('planCategory');
            const priorityInput = document.getElementById('planPriority');

            if (!textInput.value.trim()) {
                alert('계획 제목을 입력해주세요.');
                return;
            }

            if (editIndex === "") {
                const newPlan = {
                    id: Date.now(),
                    user_id: currentUser.id,
                    text: textInput.value,
                    date: dateInput.value || '날짜 미지정',
                    category: categoryInput.value,
                    priority: priorityInput.value,
                    completed: false,
                    todos: [] // 세부 할 일 목록
                };
                plans.push(newPlan);
            } else {
                const index = parseInt(editIndex);
                plans[index].text = textInput.value;
                plans[index].date = dateInput.value || '날짜 미지정';
                plans[index].category = categoryInput.value;
                plans[index].priority = priorityInput.value;
                resetForm();
            }

            textInput.value = '';
            saveAndRender();
        }

        function editPlan(id) {
            const plan = plans.find(p => p.id === id);
            const index = plans.findIndex(p => p.id === id);
            if (!plan) return;

            document.getElementById('planText').value = plan.text;
            document.getElementById('planDate').value = plan.date !== '날짜 미지정' ? plan.date : '';
            document.getElementById('planCategory').value = plan.category || '업무';
            document.getElementById('planPriority').value = plan.priority;
            document.getElementById('editIndex').value = index;

            document.getElementById('formTitle').innerText = '계획 수정하기';
            document.getElementById('submitBtn').innerText = '수정 완료';
            document.getElementById('cancelBtn').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('editIndex').value = '';
            document.getElementById('planText').value = '';
            document.getElementById('planDate').value = todayStr;
            document.getElementById('formTitle').innerText = '새 계획 만들기';
            document.getElementById('submitBtn').innerText = '계획 등록하기';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        function togglePlan(id) {
            plans = plans.map(p => p.id === id ? { ...p, completed: !p.completed } : p);
            saveAndRender();
        }

        async function deletePlan(id) {
            if (confirm('이 계획과 하위 할 일이 모두 삭제됩니다.')) {
                plans = plans.filter(p => p.id !== id);
                renderPlans();
                const { error } = await db.from('plans').delete().eq('id', id);
                if (error) console.error('삭제 실패:', error);
            }
        }

        // --- 세부 할 일 (Todo) 관리 ---
        function addTodo(planId) {
            const textInput = document.getElementById(`todoText_${planId}`);
            const dateInput = document.getElementById(`todoDate_${planId}`);
            const priorityInput = document.getElementById(`todoPriority_${planId}`);
            const tagInput = document.getElementById(`todoTag_${planId}`);
            const timeInput = document.getElementById(`todoTime_${planId}`);

            if (!textInput.value.trim()) {
                alert('할 일 내용을 입력해주세요.');
                return;
            }

            const plan = plans.find(p => p.id === planId);
            if (plan) {
                if (!plan.todos) plan.todos = [];
                plan.todos.push({
                    id: Date.now(),
                    text: textInput.value,
                    date: dateInput.value || todayStr,
                    priority: priorityInput.value,
                    tag: tagInput.value.trim() || '일반',
                    time: timeInput.value.trim() || '1시간',
                    completed: false
                });
                textInput.value = '';
                tagInput.value = '';
                timeInput.value = '';
                saveAndRender();
            }
        }

        function toggleTodo(planId, todoId) {
            const plan = plans.find(p => p.id === planId);
            if (plan) {
                plan.todos = plan.todos.map(t => t.id === todoId ? { ...t, completed: !t.completed } : t);
                saveAndRender();
            }
        }

        function deleteTodo(planId, todoId) {
            const plan = plans.find(p => p.id === planId);
            if (plan) {
                plan.todos = plan.todos.filter(t => t.id !== todoId);
                saveAndRender();
            }
        }

        function editTodoPrompt(planId, todoId) {
            const plan = plans.find(p => p.id === planId);
            if (!plan) return;
            const todo = plan.todos.find(t => t.id === todoId);
            if (!todo) return;

            const newText = prompt('할 일 내용을 수정하세요:', todo.text);
            if (newText !== null && newText.trim() !== '') {
                todo.text = newText.trim();
                saveAndRender();
            }
        }

        // --- 렌더링, 검색, 거르기, 정렬 ---
        function renderPlans() {
            const container = document.getElementById('planListContainer');
            container.innerHTML = '';

            const hideCompletedPlans = document.getElementById('hideCompletedPlans').checked;
            let completedPlanCount = 0;

            if (plans.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--sub-text); padding: 20px;">등록된 계획이 없습니다.</p>';
                document.getElementById('totalCount').innerText = '0개';
                document.getElementById('completedCount').innerText = '0개';
                document.getElementById('pendingCount').innerText = '0개';
                return;
            }

            plans.forEach(p => {
                if (p.completed) completedPlanCount++;
                if (hideCompletedPlans && p.completed) return;

                // 컨트롤 패널의 검색어, 필터, 정렬 상태 읽기 (각 플랜별 유지 또는 전역 요소)
                const searchKeyword = (document.getElementById(`search_${p.id}`)?.value || '').trim().toLowerCase();
                const filterTag = document.getElementById(`filterTag_${p.id}`)?.value || '전체';
                const sortBy = document.getElementById(`sortBy_${p.id}`)?.value || 'default';

                // 할 일 필터링(거르기) 및 검색
                let processedTodos = [...(p.todos || [])];

                if (searchKeyword) {
                    processedTodos = processedTodos.filter(t => t.text.toLowerCase().includes(searchKeyword));
                }
                if (filterTag !== '전체') {
                    processedTodos = processedTodos.filter(t => t.tag === filterTag);
                }

                // 정렬 (동점 시 등록순(ID순) 보조 정렬 적용)
                if (sortBy === 'priority') {
                    const weight = { '상': 3, '중': 2, '하': 1 };
                    processedTodos.sort((a, b) => (weight[b.priority] || 0) - (weight[a.priority] || 0) || (a.id - b.id));
                } else if (sortBy === 'date') {
                    processedTodos.sort((a, b) => a.date.localeCompare(b.date) || (a.id - b.id));
                } else {
                    // 기본 정렬: 최신 등록순
                    processedTodos.sort((a, b) => b.id - a.id);
                }

                // 태그 목록 추출 (거르기 셀렉트박스용)
                const uniqueTags = [...new Set((p.todos || []).map(t => t.tag))];

                const cardDiv = document.createElement('div');
                cardDiv.className = 'card';
                cardDiv.style.background = 'var(--li-bg)';
                cardDiv.style.marginBottom = '15px';

                cardDiv.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                        <div class="li-left">
                            <input type="checkbox" ${p.completed ? 'checked' : ''} onclick="togglePlan(${p.id})">
                            <span class="tag-badge">${p.category || '기타'}</span>
                            <span class="text" style="font-size: 1.1em; font-weight: bold;"><b>[${p.priority}]</b> ${p.text} <small style="opacity: 0.7;">(${p.date})</small></span>
                        </div>
                        <div class="btn-group">
                            <button class="action-btn" onclick="editPlan(${p.id})">수정</button>
                            <button class="delete-btn" onclick="deletePlan(${p.id})">삭제</button>
                        </div>
                    </div>

                    <!-- 서브 할 일(Todo) 영역 -->
                    <div class="sub-todo-section">
                        <div style="font-weight: bold; margin-bottom: 8px; font-size: 0.95em; color: var(--title-color);">
                            🎯 세부 할 일 목록 (${(p.todos || []).length}개)
                        </div>

                        <!-- 검색, 거르기, 정렬 컨트롤 패널 -->
                        <div class="control-panel">
                            <div class="control-row">
                                <input type="text" id="search_${p.id}" placeholder="할 일 검색..." value="${searchKeyword}" oninput="renderPlans()" style="margin:0; flex-grow:1;">
                                <select id="filterTag_${p.id}" onchange="renderPlans()" style="margin:0; width:auto;">
                                    <option value="전체">모든 태그</option>
                                    ${uniqueTags.map(tag => `<option value="${tag}" ${filterTag === tag ? 'selected' : ''}>${tag}</option>`).join('')}
                                </select>
                                <select id="sortBy_${p.id}" onchange="renderPlans()" style="margin:0; width:auto;">
                                    <option value="default" ${sortBy === 'default' ? 'selected' : ''}>정렬: 등록순</option>
                                    <option value="priority" ${sortBy === 'priority' ? 'selected' : ''}>정렬: 우선순위순</option>
                                    <option value="date" ${sortBy === 'date' ? 'selected' : ''}>정렬: 마감일순</option>
                                </select>
                            </div>
                            <div class="sort-desc">
                                📌 현재 기준: <b>${sortBy === 'priority' ? '우선순위 높음 순 (동점 시 등록순)' : sortBy === 'date' ? '마감일 임박 순 (동점 시 등록순)' : '최신 등록 순'}</b>으로 정렬되어 있습니다.
                            </div>
                        </div>

                        <!-- 할 일 입력 폼 (5개 이상 등록 권장) -->
                        <div class="sub-todo-input-box">
                            <input type="text" id="todoText_${p.id}" placeholder="할 일 내용 입력">
                            <input type="date" id="todoDate_${p.id}" value="${todayStr}">
                            <select id="todoPriority_${p.id}">
                                <option value="상">우선순위: 상</option>
                                <option value="중" selected>우선순위: 중</option>
                                <option value="하">우선순위: 하</option>
                            </select>
                            <input type="text" id="todoTag_${p.id}" placeholder="태그 (예: 공부)">
                            <input type="text" id="todoTime_${p.id}" placeholder="예상시간 (예: 2시간)">
                            <button onclick="addTodo(${p.id})">할 일 추가</button>
                        </div>

                        <!-- 할 일 리스트 출력 -->
                        <ul style="margin-top: 10px;">
                            ${processedTodos.length === 0 ? '<li style="justify-content: center; color: var(--sub-text); font-size: 0.9em;">조건에 맞는 할 일이 없습니다.</li>' : ''}
                            ${processedTodos.map(t => `
                                <li class="${t.completed ? 'completed' : ''}">
                                    <div class="li-left">
                                        <input type="checkbox" ${t.completed ? 'checked' : ''} onclick="toggleTodo(${p.id}, ${t.id})">
                                        <span class="tag-badge">#${t.tag}</span>
                                        <span class="text"><b>[${t.priority}]</b> ${t.text} <small style="opacity:0.8;">(마감:${t.date} / 예상:${t.time})</small></span>
                                    </div>
                                    <div class="btn-group">
                                        <button class="action-btn" onclick="editTodoPrompt(${p.id}, ${t.id})">수정</button>
                                        <button class="delete-btn" onclick="deleteTodo(${p.id}, ${t.id})">삭제</button>
                                    </div>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
                container.appendChild(cardDiv);
            });

            document.getElementById('totalCount').innerText = plans.length + '개';
            document.getElementById('completedCount').innerText = completedPlanCount + '개';
            document.getElementById('pendingCount').innerText = (plans.length - completedPlanCount) + '개';
        }

        // --- 하루 돌아보기 관련 함수 ---
        async function saveReview() {
            const dateInput = document.getElementById('reviewDate').value;
            const textInput = document.getElementById('dailyReviewText').value;

            if (!dateInput) {
                alert('날짜를 선택해주세요.');
                return;
            }
            if (!textInput.trim()) {
                alert('돌아보기 내용을 입력해주세요.');
                return;
            }

            reviews[dateInput] = textInput;
            const { error } = await db.from('reviews').upsert({ date: dateInput, content: textInput, user_id: currentUser.id }, { onConflict: 'date,user_id' });
            if (error) console.error('저장 실패:', error);

            document.getElementById('searchDate').value = dateInput;
            searchReview();
            alert('돌아보기 기록이 저장되었습니다.');
        }

        function searchReview() {
            const searchDate = document.getElementById('searchDate').value;
            const resultBox = document.getElementById('reviewResult');

            if (!searchDate) {
                resultBox.innerHTML = '<div class="review-content-text">날짜를 선택해주세요.</div>';
                return;
            }

            if (reviews[searchDate]) {
                resultBox.innerHTML = `
                    <div class="review-content-text">${reviews[searchDate]}</div>
                    <div class="review-actions">
                        <button class="action-btn" onclick="editReview('${searchDate}')">수정</button>
                        <button class="delete-btn" onclick="deleteReview('${searchDate}')">삭제</button>
                    </div>
                `;
            } else {
                resultBox.innerHTML = '<div class="review-content-text">해당 날짜에 작성된 돌아보기 기록이 없습니다.</div>';
            }
        }

        function editReview(dateStr) {
            document.getElementById('reviewDate').value = dateStr;
            document.getElementById('dailyReviewText').value = reviews[dateStr];
            window.scrollTo({ top: document.getElementById('dailyReviewText').offsetTop - 100, behavior: 'smooth' });
        }

        async function deleteReview(dateStr) {
            if (confirm(`${dateStr} 돌아보기 기록을 삭제하시겠습니까?`)) {
                delete reviews[dateStr];
                const { error } = await db.from('reviews').delete().eq('date', dateStr);
                if (error) console.error('삭제 실패:', error);
                searchReview();
            }
        }

        function clearSearch() {
            document.getElementById('searchDate').value = todayStr;
            searchReview();
        }

        // --- 백업 및 복원 ---
        function exportData() {
            const data = { plans, reviews };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `plandouce_backup_${todayStr}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.plans && parsed.reviews) {
                        plans = parsed.plans;
                        reviews = parsed.reviews;

                        plans = plans.map(p => ({ ...p, user_id: currentUser.id }));
                        if (plans.length > 0) {
                            await db.from('plans').upsert(plans);
                        }
                        const reviewRows = Object.keys(reviews).map(date => ({ date, content: reviews[date], user_id: currentUser.id }));
                        if (reviewRows.length > 0) {
                            await db.from('reviews').upsert(reviewRows, { onConflict: 'date,user_id' });
                        }

                        renderPlans();
                        searchReview();
                        alert('데이터가 성공적으로 복원되었습니다.');
                    } else {
                        alert('올바른 백업 파일 형식이 아닙니다.');
                    }
                } catch (err) {
                    alert('파일을 읽는 중 오류가 발생했습니다.');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // 로그인 후 내 데이터 불러오기 (RLS 덕분에 자동으로 내 것만 옵니다)
        async function loadData() {
            const { data: planData, error: planError } = await db.from('plans').select('*').order('id', { ascending: true });
            if (planError) {
                console.error('계획 불러오기 실패:', planError);
            } else {
                plans = planData || [];
            }

            const { data: reviewData, error: reviewError } = await db.from('reviews').select('*');
            if (reviewError) {
                console.error('돌아보기 불러오기 실패:', reviewError);
            } else {
                reviews = {};
                (reviewData || []).forEach(r => { reviews[r.date] = r.content; });
            }

            renderPlans();
            searchReview();
        }

        // 초기 실행: 로그인 상태 확인
        checkExistingSession();
    </script>
</body>
</html>
