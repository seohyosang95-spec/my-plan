<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플랜두씨 다이어리</title>
    <style>
        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 30px 20px; 
            background: linear-gradient(135deg, #fdfbf7 0%, #f4eee1 100%); 
            color: #4a403a; 
            min-height: 100vh;
        }
        h1 { text-align: center; color: #5c4033; font-size: 2.2em; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #8c7355; margin-bottom: 35px; font-size: 1.1em; }
        .card { 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 4px 15px rgba(92, 64, 51, 0.06); 
            margin-bottom: 25px; 
            border: 1px solid #eee4d5;
        }
        h2 { color: #6b4f3b; font-size: 1.3em; margin-top: 0; border-bottom: 2px solid #f4eee1; padding-bottom: 10px; }
        input, select, textarea { 
            padding: 12px; 
            margin: 8px 0; 
            width: calc(100% - 24px); 
            box-sizing: border-box; 
            border: 1px solid #dcd3c1; 
            border-radius: 8px; 
            background-color: #faf8f5;
            color: #4a403a;
            font-size: 1em;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #a48566;
            background-color: #fff;
        }
        button { 
            background-color: #bfa181; 
            color: white; 
            border: none; 
            padding: 12px 15px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            font-size: 1.05em;
            transition: background 0.2s;
            margin-top: 5px;
        }
        button:hover { background-color: #a48566; }
        ul { list-style: none; padding: 0; }
        li { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            background: #faf6f0; 
            padding: 12px 15px; 
            margin-top: 10px; 
            border-radius: 10px; 
            border: 1px solid #f0e6da;
        }
        li.completed span.text { text-decoration: line-through; color: #b5aca6; }
        .li-left { display: flex; align-items: center; gap: 12px; flex-grow: 1; }
        input[type="checkbox"] { width: 20px; height: 20px; accent-color: #bfa181; cursor: pointer; margin: 0; }
        
        .delete-btn { background-color: #d99b9b; width: auto; padding: 6px 12px; font-size: 0.9em; border-radius: 6px; }
        .delete-btn:hover { background-color: #c48282; }

        /* 돌아보기 목록 스타일 */
        .review-item {
            background: #faf6f0;
            padding: 15px;
            margin-top: 10px;
            border-radius: 10px;
            border: 1px solid #f0e6da;
        }
        .review-item .review-date {
            font-weight: bold;
            color: #8c7355;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .review-item .review-content {
            white-space: pre-wrap;
            color: #4a403a;
        }

        .stats { display: flex; justify-content: space-around; text-align: center; }
        .stats div div:last-child { font-size: 1.8em; font-weight: bold; color: #6b4f3b; margin-top: 8px; }
    </style>
</head>
<body>

    <h1>플랜두씨 다이어리</h1>
    <p class="subtitle">계획하고(Plan), 실행한 뒤(Do), 돌아보기(See)</p>

    <!-- 새 계획 만들기 -->
    <div class="card">
        <h2>새 계획 만들기</h2>
        <input type="text" id="planText" placeholder="하고 싶은 계획을 입력하세요">
        <input type="date" id="planDate">
        <select id="planPriority">
            <option value="상">중요도: 상</option>
            <option value="중" selected>중요도: 중</option>
            <option value="하">중요도: 하</option>
        </select>
        <button onclick="addPlan()">계획 추가하기</button>
    </div>

    <!-- 내 계획 목록 -->
    <div class="card">
        <h2>내 계획 목록</h2>
        <ul id="planList"></ul>
    </div>

    <!-- 하루 돌아보기 -->
    <div class="card">
        <h2>하루 돌아보기 작성</h2>
        <input type="date" id="reviewDate">
        <textarea id="dailyReviewText" rows="4" placeholder="오늘 하루를 돌아보며 적어보세요"></textarea>
        <button onclick="saveReview()">돌아보기 저장하기</button>
    </div>

    <!-- 지난 하루 돌아보기 목록 -->
    <div class="card">
        <h2>지난 돌아보기 기록</h2>
        <div id="reviewList"></div>
    </div>

    <!-- 전체 계획 집계 -->
    <div class="card">
        <h2>전체 계획 집계</h2>
        <div class="stats">
            <div>
                <div>등록된 전체 계획</div>
                <div id="totalCount">0개</div>
            </div>
            <div>
                <div>성공적으로 완료한 계획</div>
                <div id="completedCount">0개</div>
            </div>
            <div>
                <div>아직 못 한 계획</div>
                <div id="pendingCount">0개</div>
            </div>
        </div>
    </div>

    <script>
        // 데이터 불러오기
        let plans = JSON.parse(localStorage.getItem('plans')) || [];
        let reviews = JSON.parse(localStorage.getItem('reviews')) || [];

        // 오늘 날짜를 기본값으로 설정
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('planDate').value = todayStr;
        document.getElementById('reviewDate').value = todayStr;

        // --- 계획 관련 함수 ---
        function saveAndRenderPlans() {
            localStorage.setItem('plans', JSON.stringify(plans));
            renderPlans();
        }

        function addPlan() {
            const textInput = document.getElementById('planText');
            const dateInput = document.getElementById('planDate');
            const priorityInput = document.getElementById('planPriority');

            if (!textInput.value.trim()) {
                alert('계획 내용을 입력해주세요.');
                return;
            }

            const newPlan = {
                id: Date.now(),
                text: textInput.value,
                date: dateInput.value || '날짜 미지정',
                priority: priorityInput.value,
                completed: false
            };

            plans.push(newPlan);
            textInput.value = '';
            saveAndRenderPlans();
        }

        function togglePlan(id) {
            plans = plans.map(p => p.id === id ? { ...p, completed: !p.completed } : p);
            saveAndRenderPlans();
        }

        function deletePlan(id) {
            plans = plans.filter(p => p.id !== id);
            saveAndRenderPlans();
        }

        function renderPlans() {
            const listEl = document.getElementById('planList');
            listEl.innerHTML = '';

            let completed = 0;

            plans.forEach(p => {
                if (p.completed) completed++;

                const li = document.createElement('li');
                if (p.completed) li.classList.add('completed');

                li.innerHTML = `
                    <div class="li-left">
                        <input type="checkbox" ${p.completed ? 'checked' : ''} onclick="togglePlan(${p.id})">
                        <span class="text"><b>[${p.priority}]</b> ${p.text} <small style="color:#8c7355;">(${p.date})</small></span>
                    </div>
                    <button class="delete-btn" onclick="deletePlan(${p.id})">삭제</button>
                `;
                listEl.appendChild(li);
            });

            document.getElementById('totalCount').innerText = plans.length + '개';
            document.getElementById('completedCount').innerText = completed + '개';
            document.getElementById('pendingCount').innerText = (plans.length - completed) + '개';
        }

        // --- 하루 돌아보기 관련 함수 ---
        function saveReview() {
            const dateInput = document.getElementById('reviewDate').value;
            const textInput = document.getElementById('dailyReviewText').value;

            if (!dateInput) {
                alert('날짜를 선택해주세요.');
                return;
            }
            if (!textInput.trim()) {
                alert('돌아보기 내용을 입력해주세요.');
                return;
            }

            // 이미 해당 날짜의 기록이 있다면 덮어쓰기, 없으면 새로 추가
            const existingIndex = reviews.findIndex(r => r.date === dateInput);
            if (existingIndex >= 0) {
                reviews[existingIndex].content = textInput;
            } else {
                reviews.push({ id: Date.now(), date: dateInput, content: textInput });
                // 날짜 최신순 정렬
                reviews.sort((a, b) => new Date(b.date) - new Date(a.date));
            }

            localStorage.setItem('reviews', JSON.stringify(reviews));
            document.getElementById('dailyReviewText').value = '';
            renderReviews();
            alert('돌아기가 저장되었습니다.');
        }

        function deleteReview(id) {
            reviews = reviews.filter(r => r.id !== id);
            localStorage.setItem('reviews', JSON.stringify(reviews));
            renderReviews();
        }

        function renderReviews() {
            const reviewListEl = document.getElementById('reviewList');
            reviewListEl.innerHTML = '';

            if (reviews.length === 0) {
                reviewListEl.innerHTML = '<p style="text-align: center; color: #a39587; margin: 10px 0;">아직 작성된 돌아보기 기록이 없습니다.</p>';
                return;
            }

            reviews.forEach(r => {
                const div = document.createElement('div');
                div.className = 'review-item';
                div.innerHTML = `
                    <div class="review-date">
                        <span>📅 ${r.date}</span>
                        <button class="delete-btn" onclick="deleteReview(${r.id})">삭제</button>
                    </div>
                    <div class="review-content">${r.content}</div>
                `;
                reviewListEl.appendChild(div);
            });
        }

        // 초기 렌더링 실행
        renderPlans();
        renderReviews();
    </script>
</body>
</html>
