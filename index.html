<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>플랜두씨 다이어리 - 이력 관리 버전</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 760px;
    margin: 0 auto;
    padding: 16px;
    color: #222;
    background: #fafaf8;
  }
  h1 { font-size: 22px; font-weight: 600; margin: 0; }
  h2 { font-size: 14px; font-weight: 600; margin: 0; color: #444; }
  .subtitle { font-size: 13px; color: #8a8a86; margin: 4px 0 16px; }
  .banner {
    background: #fff8e6; border: 1px solid #f0d989; border-radius: 10px;
    padding: 10px 14px; margin-bottom: 16px; font-size: 13px;
  }
  .banner.error { background: #fdeaea; border-color: #f0a8a8; color: #a32d2d; display: none; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid #eee; }
  .tab-btn {
    padding: 8px 4px; margin-bottom: -1px; border: none; background: none;
    border-bottom: 2px solid transparent; font-size: 14px; color: #888; cursor: pointer;
  }
  .tab-btn.active { border-bottom-color: #222; font-weight: 600; color: #222; }
  .date-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
  .date-chip {
    flex-shrink: 0; padding: 6px 12px; border-radius: 20px; border: 1px solid #ddd;
    background: #fff; color: #555; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .date-chip.active { border: 1.5px solid #222; background: #222; color: #fff; }
  .date-chip.add { border: 1px dashed #ccc; color: #888; }
  .section { margin-bottom: 20px; }
  .section-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  
  /* Plan Form Styles */
  .plan-form-box { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 12px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 8px; }
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=text], select, textarea {
    padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; font-family: inherit; background: #fff;
  }
  .form-row input[name=text] { flex: 2; min-width: 200px; }
  .form-row input[name=period] { flex: 1; min-width: 130px; }
  .form-row select[name=priority] { width: 90px; }
  .form-row input[name=criteria] { flex: 1; min-width: 140px; }
  .form-row input[name=estTime] { width: 90px; }
  .btn-add {
    padding: 8px 16px; background: #222; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; align-self: flex-end;
  }
  
  .empty-hint { font-size: 13px; color: #aaa; margin: 8px 0; }
  .plan-card { border: 1px solid #eee; border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #fff; }
  .plan-main-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .plan-title { font-size: 15px; font-weight: 600; color: #111; }
  .plan-meta { display: flex; gap: 8px; font-size: 12px; color: #666; margin-top: 4px; flex-wrap: wrap; }
  .badge { background: #eee; padding: 2px 6px; border-radius: 4px; font-weight: 500; }
  .badge.priority-high { background: #FCEBEB; color: #A32D2D; }
  .badge.priority-mid { background: #FEF3D6; color: #8F6B00; }
  .badge.priority-low { background: #E1F5EE; color: #0F6E56; }
  
  .plan-actions { display: flex; gap: 6px; }
  .btn-action { border: 1px solid #ddd; background: #fff; padding: 4px 8px; border-radius: 6px; font-size: 12px; cursor: pointer; color: #444; }
  .btn-action:hover { background: #f5f5f2; }
  
  .history-box { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #eee; font-size: 12px; color: #888; display: none; }
  .history-box.open { display: block; }
  .history-item { background: #f9f9f6; padding: 6px 8px; border-radius: 6px; margin-top: 4px; border: 1px solid #eee; }
  
  .check-row { display: flex; gap: 6px; margin-top: 8px; }
  .check-btn {
    font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid #ddd;
    background: #fff; color: #777; cursor: pointer;
  }
  .check-btn.done.active { border-color: #1D9E75; background: #E1F5EE; color: #0F6E56; }
  .check-btn.missed.active { border-color: #E24B4A; background: #FCEBEB; color: #A32D2D; }
  .note-input { width: 100%; margin-top: 8px; padding: 6px 8px; border: 1px solid #eee; border-radius: 6px; font-size: 12px; }
  
  textarea.reflection { width: 100%; padding: 10px; border-radius: 8px; font-size: 13px; resize: vertical; background: #fff; }
  .hint-small { font-size: 11px; color: #aaa; margin-top: 4px; }
  
  /* Edit Modal */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center; z-index: 100; }
  .modal-overlay.active { display: flex; }
  .modal-card { background: #fff; padding: 20px; border-radius: 12px; width: 90%; max-width: 450px; display: flex; flex-direction: column; gap: 10px; }
  .modal-card h3 { margin: 0 0 8px 0; font-size: 16px; }
  .modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
  
  .view { display: none; }
  .view.active { display: block; }
</style>
</head>
<body>

<h1>플랜두씨 다이어리</h1>
<p class="subtitle">계획(Plan) → 실행(Do) → 돌아보기(See) [이력 보존 기능 포함]</p>

<div class="banner">
  이 페이지는 아직 로그인 기능이 없습니다. <b>이 링크를 아는 사람은 누구나 보고 편집할 수 있습니다.</b>
  공개해도 괜찮은 내용만 기록해 주세요.
</div>
<div class="banner error" id="saveError">저장에 실패했습니다. 네트워크를 확인하고 다시 시도해 주세요.</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="day">오늘의 계획</button>
</div>

<!-- DAY VIEW -->
<div class="view active" id="view-day">
  <div class="date-scroll" id="dateScroll"></div>

  <div class="section">
    <div class="section-head"><h2>계획 등록 (T06-C04 ~ C07)</h2></div>
    <div class="plan-form-box">
      <div class="form-row">
        <input type="text" name="text" id="newText" placeholder="예: ALEPH 진행 또는 운동 30분">
        <input type="text" name="period" id="newPeriod" placeholder="기간 (예: 09:00~10:00)">
      </div>
      <div class="form-row">
        <select name="priority" id="newPriority">
          <option value="상">우선순위: 상</option>
          <option value="중" selected>우선순위: 중</option>
          <option value="하">우선순위: 하</option>
        </select>
        <input type="text" name="criteria" id="newCriteria" placeholder="성공 기준 (예: 에러 없이 빌드 성공)">
        <input type="text" name="estTime" id="newEstTime" placeholder="예상 시간(분)" value="30">
      </div>
      <button class="btn-add" id="addPlanBtn">계획 추가하기</button>
    </div>
    
    <div class="section-head"><h2>계획 목록 및 수정 이력 (T06-C08)</h2></div>
    <div id="plansContainer"></div>
  </div>

  <div class="section">
    <div class="section-head"><h2>돌아보기 (See)</h2></div>
    <textarea class="reflection" id="reflectionBox" rows="4" placeholder="오늘 계획과 실제가 어디서 어긋났나요? 다음 계획에 반영할 점은?"></textarea>
    <p class="hint-small">입력 중 실시간 자동 저장됩니다.</p>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal">
  <div class="modal-card">
    <h3>계획 수정 (수정 전 내용은 이력에 보존됩니다)</h3>
    <label class="hint-small">계획 내용</label>
    <input type="text" id="editModalText">
    <label class="hint-small">기간</label>
    <input type="text" id="editModalPeriod">
    <label class="hint-small">우선순위</label>
    <select id="editModalPriority">
      <option value="상">상</option>
      <option value="중">중</option>
      <option value="하">하</option>
    </select>
    <label class="hint-small">성공 기준</label>
    <input type="text" id="editModalCriteria">
    <label class="hint-small">예상 시간</label>
    <input type="text" id="editModalEstTime">
    
    <div class="modal-btns">
      <button class="btn-action" id="modalCancelBtn">취소</button>
      <button class="btn-add" id="modalSaveBtn" style="padding: 6px 12px; font-size: 13px;">저장</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'plandosee:entries:v2';

const STORAGE = {
  async get() {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  },
  async set(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  }
};

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function today() { return new Date().toISOString().slice(0, 10); }
function fmtDate(d) {
  const dt = new Date(d + 'T00:00:00');
  return isNaN(dt) ? d : dt.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', weekday: 'short' });
}

function buildSeedData() {
  const t = today();
  return {
    [t]: {
      plans: [
        {
          id: uid(),
          text: 'ALEPH 진행 및 알고리즘 문제 풀이',
          period: '10:00 ~ 12:00',
          priority: '상',
          criteria: '테스트 케이스 모두 통과',
          estTime: '120분',
          done: null,
          actualNote: '',
          history: [] // 수정 전 최초 계획 및 이전 버전들이 여기에 누적됨
        }
      ],
      reflection: ''
    }
  };
}

let days = {};
let selectedDate = today();
let saveTimeout = null;
let editingPlanId = null;

async function loadData() {
  let data = await STORAGE.get();
  if (!data) {
    data = buildSeedData();
    await STORAGE.set(data);
  }
  days = data;
}

async function persist() {
  try {
    const ok = await STORAGE.set(days);
    if (!ok) throw new Error('save failed');
    document.getElementById('saveError').style.display = 'none';
  } catch (e) {
    console.error(e);
    document.getElementById('saveError').style.display = 'block';
  }
}

function debouncedPersist() {
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => { await persist(); }, 400);
}

function ensureDay(date) {
  if (!days[date]) days[date] = { plans: [], reflection: '' };
  return days[date];
}

function renderDateScroll() {
  const scroll = document.getElementById('dateScroll');
  const dates = Array.from(new Set([...Object.keys(days), today()])).sort();
  scroll.innerHTML = '';
  dates.forEach(d => {
    const chip = document.createElement('button');
    chip.className = 'date-chip' + (d === selectedDate ? ' active' : '');
    chip.textContent = fmtDate(d);
    chip.onclick = () => { selectedDate = d; renderAll(); };
    scroll.appendChild(chip);
  });
  const addChip = document.createElement('button');
  addChip.className = 'date-chip add';
  addChip.textContent = '+ 날짜';
  addChip.onclick = () => {
    const nd = prompt('YYYY-MM-DD 형식으로 날짜를 입력하세요', today());
    if (nd && /^\d{4}-\d{2}-\d{2}$/.test(nd)) { selectedDate = nd; renderAll(); }
    else if (nd) alert('올바른 날짜 형식(YYYY-MM-DD)이 아닙니다.');
  };
  scroll.appendChild(addChip);
}

function renderPlans() {
  const container = document.getElementById('plansContainer');
  const dayData = ensureDay(selectedDate);
  container.innerHTML = '';
  if (dayData.plans.length === 0) {
    container.innerHTML = '<p class="empty-hint">이 날짜에 등록된 계획이 없습니다. 위에서 계획을 추가해 보세요.</p>';
    return;
  }

  dayData.plans.forEach(plan => {
    const card = document.createElement('div');
    card.className = 'plan-card';
    
    let priorityClass = 'badge priority-mid';
    if (plan.priority === '상') priorityClass = 'badge priority-high';
    if (plan.priority === '하') priorityClass = 'badge priority-low';

    card.innerHTML = `
      <div class="plan-main-row">
        <div>
          <div class="plan-title">${escapeHtml(plan.text)}</div>
          <div class="plan-meta">
            <span class="${priorityClass}">우선순위: ${plan.priority}</span>
            <span class="badge">기간: ${escapeHtml(plan.period || '미설정')}</span>
            <span class="badge">성공기준: ${escapeHtml(plan.criteria || '미설정')}</span>
            <span class="badge">예상시간: ${escapeHtml(plan.estTime || '미설정')}</span>
          </div>
        </div>
        <div class="plan-actions">
          <button class="btn-action" data-edit="${plan.id}">수정</button>
          <button class="btn-action" data-toggle-history="${plan.id}">이력 보기 (${plan.history.length})</button>
          <button class="btn-action" data-remove="${plan.id}" style="color:#A32D2D;">삭제</button>
        </div>
      </div>

      <div class="check-row">
        <button class="check-btn done ${plan.done === true ? 'active' : ''}" data-toggle="${plan.id}" data-value="true">했음</button>
        <button class="check-btn missed ${plan.done === false ? 'active' : ''}" data-toggle="${plan.id}" data-value="false">못함</button>
      </div>
      ${plan.done !== null ? `<input type="text" class="note-input" data-note="${plan.id}" value="${escapeAttr(plan.actualNote || '')}" placeholder="${plan.done ? '실제로 어떻게 했는지 메모 (선택)' : '왜 못했는지 메모 (선택)'}">` : ''}

      <div class="history-box" id="history-${plan.id}">
        <strong>[T06-C08] 수정 전 최초/이전 계획 이력:</strong>
        ${plan.history.length === 0 ? '<div class="history-item">수정 이력이 없습니다.</div>' : ''}
        ${plan.history.map((h, idx) => `
          <div class="history-item">
            #${idx + 1} (${h.updatedAt})<br>
            - 내용: ${escapeHtml(h.text)}<br>
            - 기간: ${escapeHtml(h.period)} | 우선순위: ${h.priority} | 성공기준: ${escapeHtml(h.criteria)} | 예상시간: ${escapeHtml(h.estTime)}
          </div>
        `).join('')}
      </div>
    `;
    container.appendChild(card);
  });

  // 이벤트 핸들러 바인딩
  container.querySelectorAll('[data-remove]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('정말 이 계획을 삭제하시겠습니까?')) return;
      const id = btn.dataset.remove;
      ensureDay(selectedDate).plans = ensureDay(selectedDate).plans.filter(p => p.id !== id);
      await persist();
      renderAll();
    };
  });

  container.querySelectorAll('[data-edit]').forEach(btn => {
    btn.onclick = () => openEditModal(btn.dataset.edit);
  });

  container.querySelectorAll('[data-toggle-history]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.toggleHistory;
      const box = document.getElementById(`history-${id}`);
      box.classList.toggle('open');
    };
  });

  container.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.toggle;
      const value = btn.dataset.value === 'true';
      const plan = ensureDay(selectedDate).plans.find(p => p.id === id);
      plan.done = plan.done === value ? null : value;
      await persist();
      renderAll();
    };
  });

  container.querySelectorAll('[data-note]').forEach(input => {
    input.oninput = () => {
      const id = input.dataset.note;
      const plan = ensureDay(selectedDate).plans.find(p => p.id === id);
      if (plan) {
        plan.actualNote = input.value;
        debouncedPersist();
      }
    };
  });
}

function renderReflection() {
  const box = document.getElementById('reflectionBox');
  box.value = ensureDay(selectedDate).reflection || '';
  box.oninput = () => {
    ensureDay(selectedDate).reflection = box.value;
    debouncedPersist();
  };
}

function openEditModal(planId) {
  const plan = ensureDay(selectedDate).plans.find(p => p.id === planId);
  if (!plan) return;
  editingPlanId = planId;
  document.getElementById('editModalText').value = plan.text;
  document.getElementById('editModalPeriod').value = plan.period;
  document.getElementById('editModalPriority').value = plan.priority;
  document.getElementById('editModalCriteria').value = plan.criteria;
  document.getElementById('editModalEstTime').value = plan.estTime;
  document.getElementById('editModal').classList.add('active');
}

document.getElementById('modalCancelBtn').onclick = () => {
  document.getElementById('editModal').classList.remove('active');
  editingPlanId = null;
};

document.getElementById('modalSaveBtn').onclick = async () => {
  if (!editingPlanId) return;
  const plan = ensureDay(selectedDate).plans.find(p => p.id === editingPlanId);
  if (!plan) return;

  const newText = document.getElementById('editModalText').value.trim();
  if (!newText) {
    alert('계획 내용을 입력해주세요.');
    return;
  }

  // T06-C08: 수정 전 기존 내용을 history에 백업
  plan.history.push({
    text: plan.text,
    period: plan.period,
    priority: plan.priority,
    criteria: plan.criteria,
    estTime: plan.estTime,
    updatedAt: new Date().toLocaleString()
  });

  // 새로운 값으로 업데이트 (ID는 그대로 유지)
  plan.text = newText;
  plan.period = document.getElementById('editModalPeriod').value.trim();
  plan.priority = document.getElementById('editModalPriority').value;
  plan.criteria = document.getElementById('editModalCriteria').value.trim();
  plan.estTime = document.getElementById('editModalEstTime').value.trim();

  document.getElementById('editModal').classList.remove('active');
  editingPlanId = null;

  await persist();
  renderAll();
};

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function escapeAttr(str) {
  return String(str).replace(/"/g, '&quot;');
}

function renderAll() {
  renderDateScroll();
  renderPlans();
  renderReflection();
}

document.getElementById('addPlanBtn').onclick = async () => {
  const textInput = document.getElementById('newText');
  const periodInput = document.getElementById('newPeriod');
  const priorityInput = document.getElementById('newPriority');
  const criteriaInput = document.getElementById('newCriteria');
  const estTimeInput = document.getElementById('newEstTime');

  const text = textInput.value.trim();
  if (!text) {
    alert('계획 내용을 입력해 주세요.');
    return;
  }

  ensureDay(selectedDate).plans.push({
    id: uid(),
    text,
    period: periodInput.value.trim(),
    priority: priorityInput.value,
    criteria: criteriaInput.value.trim(),
    estTime: estTimeInput.value.trim(),
    done: null,
    actualNote: '',
    history: []
  });

  textInput.value = '';
  periodInput.value = '';
  criteriaInput.value = '';
  estTimeInput.value = '';

  await persist();
  renderAll();
};

document.getElementById('newText').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('addPlanBtn').click();
});

(async function init() {
  await loadData();
  renderAll();
})();
</script>
</body>
</html>
