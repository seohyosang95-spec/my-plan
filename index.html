<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플랜두씨 다이어리</title>
    <style>
        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 30px 20px; 
            background: linear-gradient(135deg, #fdfbf7 0%, #f4eee1 100%); 
            color: #4a403a; 
            min-height: 100vh;
        }
        h1 { text-align: center; color: #5c4033; font-size: 2.2em; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #8c7355; margin-bottom: 35px; font-size: 1.1em; }
        .card { 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 4px 15px rgba(92, 64, 51, 0.06); 
            margin-bottom: 25px; 
            border: 1px solid #eee4d5;
        }
        h2 { color: #6b4f3b; font-size: 1.3em; margin-top: 0; border-bottom: 2px solid #f4eee1; padding-bottom: 10px; }
        input, select, textarea { 
            padding: 12px; 
            margin: 8px 0; 
            width: calc(100% - 24px); 
            box-sizing: border-box; 
            border: 1px solid #dcd3c1; 
            border-radius: 8px; 
            background-color: #faf8f5;
            color: #4a403a;
            font-size: 1em;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #a48566;
            background-color: #fff;
        }
        button { 
            background-color: #bfa181; 
            color: white; 
            border: none; 
            padding: 12px 15px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            font-size: 1.05em;
            transition: background 0.2s;
            margin-top: 5px;
        }
        button:hover { background-color: #a48566; }
        ul { list-style: none; padding: 0; }
        li { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            background: #faf6f0; 
            padding: 12px 15px; 
            margin-top: 10px; 
            border-radius: 10px; 
            border: 1px solid #f0e6da;
        }
        li.completed span.text { text-decoration: line-through; color: #b5aca6; }
        .li-left { display: flex; align-items: center; gap: 12px; flex-grow: 1; }
        input[type="checkbox"] { width: 20px; height: 20px; accent-color: #bfa181; cursor: pointer; margin: 0; }
        
        .delete-btn { background-color: #d99b9b; width: auto; padding: 6px 12px; font-size: 0.9em; border-radius: 6px; }
        .delete-btn:hover { background-color: #c48282; }

        /* 돌아보기 조회 영역 스타일 */
        .search-box {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }
        .search-box input {
            margin: 0;
            flex-grow: 1;
        }
        .search-box button {
            width: auto;
            margin: 0;
            padding: 12px 20px;
            white-space: nowrap;
        }
        .review-result-box {
            background: #faf6f0;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #f0e6da;
            min-height: 80px;
            white-space: pre-wrap;
            color: #4a403a;
        }

        .stats { display: flex; justify-content: space-around; text-align: center; }
        .stats div div:last-child { font-size: 1.8em; font-weight: bold; color: #6b4f3b; margin-top: 8px; }
    </style>
</head>
<body>

    <h1>플랜두씨 다이어리</h1>
    <p class="subtitle">계획하고(Plan), 실행한 뒤(Do), 돌아보기(See)</p>

    <!-- 새 계획 만들기 -->
    <div class="card">
        <h2>새 계획 만들기</h2>
        <input type="text" id="planText" placeholder="하고 싶은 계획을 입력하세요">
        <input type="date" id="planDate">
        <select id="planPriority">
            <option value="상">중요도: 상</option>
            <option value="중" selected>중요도: 중</option>
            <option value="하">중요도: 하</option>
        </select>
        <button onclick="addPlan()">계획 추가하기</button>
    </div>

    <!-- 내 계획 목록 -->
    <div class="card">
        <h2>내 계획 목록</h2>
        <ul id="planList"></ul>
    </div>

    <!-- 하루 돌아보기 작성 -->
    <div class="card">
        <h2>하루 돌아보기 작성</h2>
        <input type="date" id="reviewDate">
        <textarea id="dailyReviewText" rows="4" placeholder="오늘 하루를 돌아보며 적어보세요"></textarea>
        <button onclick="saveReview()">돌아보기 저장하기</button>
    </div>

    <!-- 날짜별 돌아보기 조회 -->
    <div class="card">
        <h2>날짜별 돌아보기 보기</h2>
        <div class="search-box">
            <input type="date" id="searchDate" onchange="searchReview()">
            <button class="delete-btn" style="background-color: #bfa181;" onclick="clearSearch()">전체보기</button>
        </div>
        <div id="reviewResult" class="review-result-box">날짜를 선택하면 해당 기록이 여기에 표시됩니다.</div>
    </div>

    <!-- 전체 계획 집계 -->
    <div class="card">
        <h2>전체 계획 집계</h2>
        <div class="stats">
            <div>
                <div>등록된 전체 계획</div>
                <div id="totalCount">0개</div>
            </div>
            <div>
                <div>성공적으로 완료한 계획</div>
                <div id="completedCount">0개</div>
            </div>
            <div>
                <div>아직 못 한 계획</div>
                <div id="pendingCount">0개</div>
            </div>
        </div>
    </div>

    <script>
        let plans = JSON.parse(localStorage.getItem('plans')) || [];
        let reviews = JSON.parse(localStorage.getItem('reviews')) || {}; // 객체 형태로 관리

        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('planDate').value = todayStr;
        document.getElementById('reviewDate').value = todayStr;
        document.getElementById('searchDate').value = todayStr;

        // --- 계획 관련 함수 ---
        function saveAndRenderPlans() {
            localStorage.setItem('plans', JSON.stringify(plans));
            renderPlans();
        }

        function addPlan() {
            const textInput = document.getElementById('planText');
            const dateInput = document.getElementById('planDate');
            const priorityInput = document.getElementById('planPriority');

            if (!textInput.value.trim()) {
                alert('계획 내용을 입력해주세요.');
                return;
            }

            const newPlan = {
                id: Date.now(),
                text: textInput.value,
                date: dateInput.value || '날짜 미지정',
                priority: priorityInput.value,
                completed: false
            };

            plans.push(newPlan);
            textInput.value = '';
            saveAndRenderPlans();
        }

        function togglePlan(id) {
            plans = plans.map(p => p.id === id ? { ...p, completed: !p.completed } : p);
            saveAndRenderPlans();
        }

        function deletePlan(id) {
            plans = plans.filter(p => p.id !== id);
            saveAndRenderPlans();
        }

        function renderPlans() {
            const listEl = document.getElementById('planList');
            listEl.innerHTML = '';

            let completed = 0;

            plans.forEach(p => {
                if (p.completed) completed++;

                const li = document.createElement('li');
                if (p.completed) li.classList.add('completed');

                li.innerHTML = `
                    <div class="li-left">
                        <input type="checkbox" ${p.completed ? 'checked' : ''} onclick="togglePlan(${p.id})">
                        <span class="text"><b>[${p.priority}]</b> ${p.text} <small style="color:#8c7355;">(${p.date})</small></span>
                    </div>
                    <button class="delete-btn" onclick="deletePlan(${p.id})">삭제</button>
                `;
                listEl.appendChild(li);
            });

            document.getElementById('totalCount').innerText = plans.length + '개';
            document.getElementById('completedCount').innerText = completed + '개';
            document.getElementById('pendingCount').innerText = (plans.length - completed) + '개';
        }

        // --- 하루 돌아보기 관련 함수 ---
        function saveReview() {
            const dateInput = document.getElementById('reviewDate').value;
            const textInput = document.getElementById('dailyReviewText').value;

            if (!dateInput) {
                alert('날짜를 선택해주세요.');
                return;
            }
            if (!textInput.trim()) {
                alert('돌아보기 내용을 입력해주세요.');
                return;
            }

            reviews[dateInput] = textInput;
            localStorage.setItem('reviews', JSON.stringify(reviews));
            
            document.getElementById('searchDate').value = dateInput;
            searchReview();
            alert('돌아기가 저장되었습니다.');
        }

        function searchReview() {
            const searchDate = document.getElementById('searchDate').value;
            const resultBox = document.getElementById('reviewResult');

            if (!searchDate) {
                resultBox.innerText = '날짜를 선택해주세요.';
                return;
            }

            if (reviews[searchDate]) {
                resultBox.innerText = reviews[searchDate];
            } else {
                resultBox.innerText = '해당 날짜에 작성된 돌아보기 기록이 없습니다.';
            }
        }

        function clearSearch() {
            document.getElementById('searchDate').value = todayStr;
            searchReview();
        }

        // 초기 실행 시 오늘 날짜 기록 불러오기
        renderPlans();
        searchReview();
    </script>
</body>
</html>
